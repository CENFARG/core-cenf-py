[project]
name = "core-cenf"
version = "0.1.0"
description = "CENF Core Infrastructure — Horizontal Transversal Managers for Python 3.12+"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "CENF", email = "gonzalo@cenf.tech"},
]
keywords = ["cenf", "clean-architecture", "hexagonal", "infrastructure", "sdd", "tdd"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "aiohttp>=3.9",
    "tenacity>=9.0",
    "aiocache>=0.12",
    "redis>=5.0",
    "cryptography>=43.0",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
]

[project.scripts]
cenf = "core_cenf_cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.0",
    "pytest-mock>=3.14",
    "ruff>=0.15",
    "mypy>=1.20",
    "types-pyyaml>=6.0",
    "types-redis>=4.6",
    "types-aiofiles>=24.0",
    "faker>=30.0",
    "aiosqlite>=0.20",
]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0"]
saq = ["saq>=0.15"]
postgres = [
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
]
s3 = ["aioboto3>=14.0"]
gcs = ["gcloud-aio-storage>=9.0"]
azure = ["azure-storage-blob>=12.0"]
all = [
    "core-cenf[sqlalchemy,postgres,s3,gcs,azure,saq]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_infrastructure", "src/core_cenf_cli"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line-too-long (handled by formatter)
    "ASYNC109", # timeout parameter in async HTTP clients is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ASYNC230", "ASYNC240"]
"**/__init__.py" = ["F401"]  # allow unused imports in __init__.py (re-exports)
"src/core_infrastructure/__init__.py" = ["F401"]  # central re-export module

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
warn_unused_ignores = false  # optional deps without stubs cause CI/local mismatch
disable_error_code = ["unused-ignore"]  # permanently disabled: optional dep stub conflicts
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "gcloud.aio.storage",
    "gcloud.aio.storage.*",
    "azure.storage.blob",
    "azure.storage.blob.*",
    "azure.core.exceptions",
    "sqlalchemy",
    "sqlalchemy.*",
    "aiobotocore.session",
    "aiobotocore.*",
    "botocore.exceptions",
    "botocore.*",
    "jose",
    "jose.*",
    "jose.exceptions",
    "redis",
    "redis.*",
    "saq",
    "saq.*",
    "aiofiles",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=core_infrastructure",
    "--cov-report=term-missing",
    "-v",
]
markers = [
    "unit: Unit tests (no external I/O)",
    "integration: Integration tests (requires external services)",
    "e2e: End-to-end tests (full lifecycle)",
    "stress: Stress tests (load and concurrency)",
    "slow: Tests that take longer than 2 seconds",
]

[tool.coverage.run]
source = ["core_infrastructure"]
branch = true

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self\\.debug:",
    "if settings\\.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
