[project]
name = "mcp-core-cenf"
version = "0.1.0"
description = "MCP server for core-cenf — semantic search across 20 infrastructure managers"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "core-cenf",
]

[project.scripts]
mcp-core-cenf = "mcp_core_cenf.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_core_cenf"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
