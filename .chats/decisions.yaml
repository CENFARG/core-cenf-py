contradictions:
  - id: "CONTRA_001"
    conflict: "80/20 Rule vs. State Machines as mandatory design"
    resolution: >
      State machines are a DESIGN rule (how you structure logic), not an
      implementation. They don't conflict with 80/20 — you CAN implement
      state machines using OSS (e.g., XState in TS, transitions in Python).
    status: "resolved"

  - id: "CONTRA_002"
    conflict: "Agent-agnostic AI Runtime vs. Hermes-specific designs in research docs"
    resolution: >
      Research docs proposed Hermes-specific managers. Decision: reframe as
      agent-agnostic. Hermes is one consumer, not the target.
    status: "resolved"

