# =============================================================================
# SECTION 1: VISION & PHILOSOPHY
# =============================================================================

vision:
  purpose: >
    Provide a reusable infrastructure foundation for all CENF projects following
    Clean Architecture, Provider Pattern, and SDD+TDD methodology. Covers
    Infrastructure Runtime (existing core-cenf), AI Runtime (Hermes, in design),
    and Developer Platform (CI/CD, quality).

  mission: >
    Build three layers on the 80/20 rule: 80% mature OSS + 20% CENF-specific
    wrapper/glue. Never reimplement what OSS already provides well. Apply
    Provider Pattern across all layers.

  philosophy:
    - id: "PHIL_CENF_001"
      statement: "80/20 Rule — 80% OSS, 20% CENF wrapper"
      rationale: >
        Reusing mature OSS (Keycloak, OPA, Vault, OpenFeature, LiteLLM, etc.)
        avoids reinventing wheels and ensures security/maintenance from
        large communities. CENF wraps only the integration layer.
      verification_query: >
        Check each manager: does it wrap an OSS provider or reimplement from scratch?
        If reimplement → flag for OSS migration.
      status: "active"

    - id: "PHIL_CENF_002"
      statement: "Provider Pattern: Manager → Provider Interface → OSS Provider → SDK"
      rationale: >
        Decouples business logic from implementation. Swap OSS providers
        without changing manager code. Same pattern used across all layers.
      verification_query: >
        Does each Manager import from ports (Protocol) not adapters?
        Should NOT import OSS SDKs directly.
      status: "enforced"

    - id: "PHIL_CENF_003"
      statement: "AI Runtime must be agent-agnostic"
      rationale: >
        Hermes, OpenCode, Claude Code, Goose, OpenClaw, Antigravity all
        consume the same services. No agent-specific code in the runtime.
      verification_query: >
        Does any AI Runtime module reference a specific agent by name
        (hermes, opencode, claude)? Should be ZERO.
      status: "active"

    - id: "PHIL_CENF_004"
      statement: "License policy: MIT > Apache 2.0 > MPL 2.0 > NO AGPL/GPL/SSPL"
      rationale: >
        AGPL/GPL/SSPL create legal risk for commercial products. MPL 2.0 OK.
        MIT and Apache 2.0 preferred.
      verification_query: >
        Check ALL dependencies in pyproject.toml and package.json.
        Any AGPL/GPL/SSPL → flag for replacement.
      status: "enforced"

    - id: "PHIL_CENF_005"
      statement: "State Machines as general design rule"
      rationale: >
        Programs with >2 steps or >1 agent MUST be defined as state machines
        first. Deterministic transitions enable testing, rollback, and
        multi-agent communication.
      verification_query: >
        Does each multi-step flow have an explicit state diagram?
      status: "active"

    - id: "PHIL_CENF_006"
      statement: "Security is non-negotiable OSS SOTA"
      rationale: >
        Auth, Authorization, Secrets, Policy — always use battle-tested OSS
        (Keycloak, OPA, Vault). No room for custom implementations.
      verification_query: >
        Are auth/authz/secrets implemented via OSS adapters? If custom → FAIL.
      status: "enforced"

    - id: "PHIL_CENF_007"
      statement: "Delegation mandatory for implementation"
      rationale: >
        SDD orchestrator never executes code. Must delegate to sub-agents
        (sdd-apply, sdd-design, etc.) for implementation work.
      status: "enforced"

# =============================================================================
# SECTION 2: STRATEGIC DECISIONS
# =============================================================================

strategic:
  - id: "STRAT_001"
    topic: "Architecture direction — modify core or create separate runtimes"
    status: "PENDING"
    description: >
      Core strategic question: do we add Infrastructure Runtime capabilities
      (Keycloak, OPA, Vault adapters) to existing core-cenf-py/ts, or do we
      create a separate runtime layer (cenf-runtime / cenf-platform)?
    options:
      - option: "Modify existing core-cenf-py/ts"
        tradeoff: "Expands current managers + providers. Single library = simpler dependency graph. Risk: bloat."
      - option: "Create separate cenf-runtime"
        tradeoff: "Clean separation. core-cenf stays lightweight. Risk: dependency complexity, two repos to maintain."
      - option: "Create cenf-platform (superset)"
        tradeoff: "Unified platform with core-cenf + runtime + dev tools. Risk: scope creep."
    next_step: "Delegate to strategic-gestion-team for analysis considering yaml-agno, arca-sdk, arcaMCP, instaldorAgentico, amBotHs, grama"

  - id: "STRAT_002"
    topic: "AI Runtime Hermes — design as separate module"
    status: "PENDING"
    description: >
      AI Runtime will serve ANY agent (agent-agnostic pattern). 12 managers
      proposed: AgentOrchestration, ToolRegistry(MCP), ContextResolver,
      PromptManager, MemoryVector(Qdrant), KnowledgeGraph, AIPolicy,
      AIAudit, AISession, HumanReview, WorkflowManager, LLMGateway(LiteLLM).
      Needs analysis of which to build vs delegate to OSS.
    next_step: "Decision deferred until STRAT_001 resolves"

  - id: "STRAT_003"
    topic: "Dependency tiering strategy"
    status: "DECIDED"
    description: >
      Dependencies classified into 3 tiers:
      - Tier 1 (mandatory): Identity, Auth, Authorization, Secrets, Observability
      - Tier 2 (value-add): Feature Flags, Cache, Event Bus, Rate Limiting
      - Tier 3 (optional): Workflows, Search, Object Storage, Config Discovery
    rationale: >
      Avoids dependency bloat. Only Tier 1 is mandatory for all projects.
      Tiers 2 and 3 are opt-in based on actual need.
    verification_query: >
      Can projects use core-cenf with ONLY Tier 1 dependencies?
      If importing Tier 2/3 forces transitive deps → refactor.
    status: "active"

  - id: "STRAT_005"
    topic: "4-Project Architecture — core-cenf separation"
    status: "DECIDED"
    description: >
      Arquitectura dividida en 4 proyectos trabajados como monolito por el mismo equipo:
      - core-cenf-py: infraestructura base Python (22 managers)
      - core-cenf-ts: port TypeScript (19 managers)
      - core-cenf-agents: infraestructura para sistemas agénticos
      - core-cenf-tenant: multi-tenant (billing, rate limiting, authz)
      Mismo equipo, mismos patrones, mismo CI/CD.
    mitigation_rules:
      - "RULE 1: Agents y Tenant dependen solo de PROTOCOLS (ports), nunca adapters"
      - "RULE 2: No duplicar patrones — copiar de core-cenf-py, no reinventar"
      - "RULE 3: core-cenf-tenant EXCLUSIVAMENTE multi-tenant, cero lógica de negocio"
      - "RULE 4: Template de repo único para los 4 proyectos"
      - "RULE 5: Mismo CI/CD pipeline en los 4"
      - "RULE 6: Majors sincronizados, minors/patch independientes"
      - "RULE 7: Documentación estándar para todo manager"
    description: >
      El equipo de gestión estratégica (fractal-validator, strategic-project-manager,
      cost-governance-analyst, go-to-market-strategist, risk-compliance-officer,
      product-market-fit-analyst) será quien analice y recomiende el camino
      a seguir para core-cenf considerando productos activos.
    next_step: "Delegate decisions.yaml to strategic-gestion-team agents"

