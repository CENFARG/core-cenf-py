name: CI/CD — core-cenf

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + Type Check + Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install core + dev deps
        run: |
          uv venv .venv
          . .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          ruff check src/ tests/

      - name: Type check (mypy strict)
        run: |
          . .venv/bin/activate
          mypy src/core_infrastructure/ --strict

      - name: Test (pytest)
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -q --tb=short --timeout=120

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Generate SBOM (CycloneDX)
        run: |
          uv venv .venv
          . .venv/bin/activate
          uv pip install cyclonedx-bom
          uv pip install -e ".[dev]"
          cyclonedx-py environment -o sbom.xml

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml

  stress:
    name: Stress Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Run stress tests
        run: |
          uv python install 3.12
          uv venv .venv
          . .venv/bin/activate
          uv pip install -e ".[dev]"
          python -m pytest tests/stress/ -v --tb=short --timeout=300 -m stress || echo "Stress tests not yet implemented — skipping"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [quality, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: |
          uv python install 3.12
          uv venv .venv
          . .venv/bin/activate
          uv pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
