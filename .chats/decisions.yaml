      All decisions, bugs, discoveries, conventions saved to Engram proactively
      (mem_save). End-of-session summaries mandatory (mem_session_summary).
      Cross-session context recovery via mem_search.

  - id: "TECH_005"
    topic: "CodeGraph for codebase exploration"
    status: "active"
    description: >
      Pre-indexed knowledge graph cuts ~58% tool calls during exploration.
      Must be used before ANY task delegation that needs codebase context.

  - id: "TECH_006"
    topic: "SDD Modes of Operation"
    status: "enforced"
    description: >
      Orchestrator operates in explicit modes:
      - ASISTENTE: analysis only, no code, no delegation
      - SDD: structured execution cycle
      - MIXTO: alternating between conversation and execution

